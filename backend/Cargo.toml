[package]
name = "equans-operational-insights-backend"
version = "0.1.0"
edition = "2021"
default-run = "equans-operational-insights-backend"

[dependencies]
# Web framework
axum = "0.7"
http = "1"
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum-server = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# JWT validation
jsonwebtoken = "10.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for JWKS and API calls
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "json"] }

# Error handling
thiserror = "2"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# UUID generation for import placeholders
uuid = { version = "1", features = ["v4"] }

# CSV parsing for FR-007 imports
csv = "1.3"

# Excel parsing for FR-007 imports
calamine = "0.26"

# Regex for pattern matching
regex = "1.11"

# Multipart file upload for FR-007
axum_typed_multipart = "0.11"
tempfile = "3"

[dev-dependencies]
# Testing
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[env]
SQLX_OFFLINE = "true"

