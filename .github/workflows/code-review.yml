name: Code Review

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equans
          POSTGRES_PASSWORD: equans
          POSTGRES_DB: equans_oi_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure backend target dir exists
        working-directory: ${{ github.workspace }}
        run: mkdir -p backend/target

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cargo fmt --check || {
            echo "::error::Rust code is not properly formatted. Run 'cargo fmt' to fix."
            exit 1
          }

      - name: Run Clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            2>&1 | tee clippy-output.txt

          # Count warnings (excluding the summary line)
          WARNINGS=$(grep -c "warning:" clippy-output.txt || echo "0")
          echo "Clippy warnings: $WARNINGS"

          if [ "$WARNINGS" -gt 0 ]; then
            echo "::warning::Clippy found $WARNINGS warnings"
          fi

      - name: Build
        run: cargo build --all-features

      - name: Run tests
        env:
          DATABASE_URL: postgres://equans:equans@localhost:5433/equans_oi_test
        run: cargo test --all-features -- --test-threads=1

      - name: Generate test coverage report
        env:
          DATABASE_URL: postgres://equans:equans@localhost:5433/equans_oi_test
        run: |
          cargo install cargo-tarpaulin || true
          cargo tarpaulin --out Xml --output-dir coverage || echo "Coverage generation skipped"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint & type check
        run: |
          npm run lint || {
            echo "::error::TypeScript errors found. Run 'tsc --noEmit' locally to fix."
            exit 1
          }

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests || true

  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          # Find files larger than 1MB
          LARGE_FILES=$(find . -type f -size +1M -not -path "./.git/*" -not -path "*/node_modules/*" -not -path "*/target/*" 2>/dev/null || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "::warning::Large files detected (>1MB):"
            echo "$LARGE_FILES"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          echo "## Code Review Notes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count TODOs in Rust files
          RUST_TODOS=$(grep -r "TODO\|FIXME\|XXX\|HACK" backend/src --include="*.rs" 2>/dev/null | wc -l || echo "0")
          echo "📝 TODOs in Rust code: $RUST_TODOS" >> $GITHUB_STEP_SUMMARY

          # Count TODOs in TypeScript files
          TS_TODOS=$(grep -r "TODO\|FIXME\|XXX\|HACK" frontend/src --include="*.ts" --include="*.tsx" 2>/dev/null | wc -l || echo "0")
          echo "📝 TODOs in TypeScript code: $TS_TODOS" >> $GITHUB_STEP_SUMMARY

          if [ "$RUST_TODOS" -gt 0 ] || [ "$TS_TODOS" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### TODO Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep -rn "TODO\|FIXME" backend/src frontend/src --include="*.rs" --include="*.ts" --include="*.tsx" 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check documentation coverage
        run: |
          # Check if README files exist
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation Status" >> $GITHUB_STEP_SUMMARY

          for dir in backend frontend docs; do
            if [ -f "$dir/README.md" ]; then
              echo "✅ $dir/README.md exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $dir/README.md missing" >> $GITHUB_STEP_SUMMARY
            fi
          done

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [rust-quality, frontend-quality, code-analysis]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Code Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.rust-quality.result }}" == "success" ]; then
            echo "| Rust Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.rust-quality.result }}" == "skipped" ]; then
            echo "| Rust Quality | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Rust Quality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.frontend-quality.result }}" == "success" ]; then
            echo "| Frontend Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.frontend-quality.result }}" == "skipped" ]; then
            echo "| Frontend Quality | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend Quality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.code-analysis.result }}" == "success" ]; then
            echo "| Code Analysis | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Analysis | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check overall status
        run: |
          if [ "${{ needs.rust-quality.result }}" == "failure" ] || \
             [ "${{ needs.frontend-quality.result }}" == "failure" ]; then
            echo "::error::Code quality checks failed. Please review the errors above."
            exit 1
          fi
