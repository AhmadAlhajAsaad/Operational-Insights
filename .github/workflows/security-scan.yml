name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --json > audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          # Check for critical or high vulnerabilities
          CRITICAL=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.high // 0')

          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found in npm dependencies"
            npm audit || true
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::High severity vulnerabilities found in npm dependencies"
            npm audit || true
          fi

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install truffleHog
        run: pip install trufflehog

      - name: Scan for secrets
        run: |
          # Scan for secrets in the repository
          trufflehog filesystem . --no-update --json > secrets-scan.json 2>&1 || true

          # Check if any secrets were found
          if [ -s secrets-scan.json ] && grep -q "detector" secrets-scan.json; then
            echo "::error::Potential secrets found in repository"
            cat secrets-scan.json
            exit 1
          else
            echo "No secrets detected"
          fi

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-results
          path: secrets-scan.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [frontend-security, secret-scanning]
    if: always()
    steps:
    - name: Check security scan results
      run: |
        if [ -z "$GITHUB_STEP_SUMMARY" ]; then
          export GITHUB_STEP_SUMMARY=/tmp/security-summary.txt
        fi

        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Store results in variables for clarity
        FRONTEND_RESULT="${{ needs.frontend-security.result }}"
        SECRET_RESULT="${{ needs.secret-scanning.result }}"

        # Check Frontend security audit
        if [ "$FRONTEND_RESULT" == "success" ]; then
          echo "✅ Frontend security audit passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Frontend security audit failed (status: $FRONTEND_RESULT)" >> $GITHUB_STEP_SUMMARY
        fi

        # Check Secret scanning
        if [ "$SECRET_RESULT" == "success" ]; then
          echo "✅ Secret scanning passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Secret scanning failed (status: $SECRET_RESULT)" >> $GITHUB_STEP_SUMMARY
        fi

        # Fail if ANY job did not succeed (catches all non-success states)
        if [ "$FRONTEND_RESULT" != "success" ] || \
           [ "$SECRET_RESULT" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Security scan failed - please review the results above" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All security scans passed successfully" >> $GITHUB_STEP_SUMMARY
